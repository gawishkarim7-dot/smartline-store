version: '3.8'

services:
  app:
    image: composer:2
    container_name: smartline_app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - php

  php:
    image: php:8.2-cli
    container_name: smartline_php
    volumes:
      - .:/app
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8007:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: smartline_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartline_store
      MYSQL_USER: smartline
      MYSQL_PASSWORD: smartline123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smartline_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
